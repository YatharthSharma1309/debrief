services:
  - type: web
    name: debrief-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_CHAT_MODEL
        value: openrouter/free
      - key: LLM_EMBEDDING_MODEL
        value: nvidia/llama-nemotron-embed-vl-1b-v2:free
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: DEBUG
        value: "false"
